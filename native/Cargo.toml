[package]
name = "kit-todo-tab"
description = "The TODO tab of the kit-todo kit: Rust, built to WebAssembly"
version = "0.1.0"
edition = "2024"
publish = false

# A cdylib is the module Hangar loads (tabs/todo.wasm); the rlib is for
# `cargo test`, which runs the tab on the host with hangar_kit_sdk::testing.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Until a release tag holds the SDK, its branch; Cargo.lock pins the commit.
hangar-kit-sdk = { git = "https://github.com/hangar-ai/hangar", branch = "feat/native-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Not part of any workspace around the kit.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
